name: Publish Sealion website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public website files
        uses: actions/checkout@v6
      - name: Validate downloads and signed update feeds
        run: python3 scripts/check_site.py --site site --repository .
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
